tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: 'Update contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '671f66a2c1889554f6956e54'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Jhon doe'
          email:
            description: "Contact's email"
            type: string
            example: jhon@example.com
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: 0931111111
          isFavourite:
            description: 'Whether contact is favourite'
            type: boolean
            default: false
            example: true
          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'home', 'personal']
            default: 'personal'
          photo:
            description: "Contact's avatar"
            type: string
            example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
responses:
  200:
    description: 'Update contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: number
              example: 200
            message:
              type: string
              example: 'Successfully patched a contact!'
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  401:
    $ref: '../../../components/responses/401.yaml'
  404:
    description: 'Not found error'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: number
              example: 404
            message:
              type: string
              example: 'NotFound'
            data:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: 'Contact not found'
